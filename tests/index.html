<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Pong — Tests de regresión</title>
    <style>
        :root { color-scheme: dark; --ok: #22c55e; --bad: #ef4444; --warn: #eab308; }
        body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0b0f14; color: #e5e7eb; }
        header { padding: 16px 24px; border-bottom: 1px solid #1f2937; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        h1 { font-size: 18px; margin: 0 12px 0 0; }
        button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #374151; background: #111827; color: inherit; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        #summary { margin-left: auto; font-weight: 600; }
        main { padding: 16px 24px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { text-align: left; padding: 6px 10px; border-bottom: 1px solid #1f2937; vertical-align: top; }
        .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
        pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; color: #9ca3af; }
        #stage { position: fixed; right: 8px; bottom: 8px; opacity: .25; pointer-events: none; transform: scale(.25); transform-origin: bottom right; }
    </style>
</head>
<body>
    <header>
        <h1>Pong — tests de regresión</h1>
        <button type="button" id="run-all">Ejecutar todos</button>
        <button type="button" id="record">Grabar referencias</button>
        <span id="summary"></span>
    </header>
    <main>
        <p>Reproduce partidas deterministas contra el juego real y las compara con las referencias de
           <code>tests/golden/</code>. Ver <code>tests/README.md</code>.</p>
        <table>
            <thead><tr><th>Escenario</th><th>Resultado</th><th>Detalle</th></tr></thead>
            <tbody id="results"></tbody>
        </table>
    </main>
    <div id="stage"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
